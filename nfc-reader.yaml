substitutions:
  name: nfc-reader
  friendly_name: NFC Reader

esphome:
  name: $name
  friendly_name: $friendly_name
  on_boot:
    priority: -10
    then:
      - wait_until:
          api.connected:
      - light.turn_on:
          id: status_light
          brightness: 30%
          red: 100%
          green: 100%
          blue: 100%

esp8266:
  board: d1_mini

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true  # also enforces WPA2 minimum auth on ESP8266
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_fallback_password

captive_portal:

i2c:
  sda: D2
  scl: D1
  scan: false
  frequency: 100kHz

light:
  - platform: neopixelbus
    variant: WS2812
    pin: D8
    num_leds: 1
    type: GRB
    id: status_light
    name: "${friendly_name} LED"
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

globals:
  - id: tag_id
    type: std::string

pn532_i2c:
  id: pn532_board
  on_tag:
    then:
      - delay: 150ms
      - lambda: |-
          id(tag_id) = "";
          if (tag.has_ndef_message()) {
            auto message = tag.get_ndef_message();
            auto &records = message->get_records();
            for (auto &record : records) {
              std::string payload = record->get_payload();
              std::string type = record->get_type();
              if (type == "U") {
                size_t hass = payload.find("https://www.home-assistant.io/tag/");
                if (hass != std::string::npos) {
                  id(tag_id) = payload.substr(hass + 34);
                }
              }
            }
          }
      - if:
          condition:
            lambda: 'return !id(tag_id).empty();'
          then:
            - homeassistant.tag_scanned: !lambda 'return id(tag_id);'
            - logger.log:
                format: "Tag scanned: %s"
                args: [id(tag_id).c_str()]
            - light.turn_on:
                id: status_light
                flash_length: 1s
                brightness: 100%
                red: 0%
                green: 100%
                blue: 0%
          else:
            - logger.log:
                format: "Tag ignored (no HA NDEF): %s"
                args: [x.c_str()]
            - light.turn_on:
                id: status_light
                flash_length: 1s
                brightness: 100%
                red: 100%
                green: 0%
                blue: 0%
  on_tag_removed:
    then:
      - logger.log: "Tag removed"
      - homeassistant.event:
          event: esphome.tag_removed

# --- Tag writing buttons (visible in HA device page) ---

button:
  - platform: template
    name: Write Tag Random
    icon: "mdi:pencil-box"
    on_press:
      then:
        - lambda: |-
            static const char hex[] = "0123456789abcdef";
            std::string uri = "https://www.home-assistant.io/tag/";
            for (int i = 0; i < 8; i++)  uri += hex[random_uint32() % 16];
            uri += "-";
            for (int j = 0; j < 3; j++) {
              for (int i = 0; i < 4; i++) uri += hex[random_uint32() % 16];
              uri += "-";
            }
            for (int i = 0; i < 12; i++) uri += hex[random_uint32() % 16];
            auto message = new nfc::NdefMessage();
            message->add_uri_record(uri);
            ESP_LOGD("nfc-reader", "Writing: %s", uri.c_str());
            id(pn532_board).write_mode(message);
        - wait_until:
            not:
              pn532.is_writing:
        - logger.log: "Tag written"
  - platform: template
    name: Clean Tag
    icon: "mdi:nfc-variant-off"
    on_press:
      then:
        - lambda: "id(pn532_board).clean_mode();"
        - wait_until:
            not:
              pn532.is_writing:
  - platform: template
    name: Cancel Writing
    icon: "mdi:pencil-off"
    on_press:
      then:
        - lambda: "id(pn532_board).read_mode();"
  - platform: restart
    name: "${friendly_name} Restart"
    entity_category: config

# --- Diagnostic entities ---

binary_sensor:
  - platform: status
    name: "${friendly_name} Status"
    entity_category: diagnostic

text_sensor:
  - platform: version
    hide_timestamp: true
    name: "${friendly_name} ESPHome Version"
    entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
      icon: mdi:wifi
      entity_category: diagnostic
    ssid:
      name: "${friendly_name} Connected SSID"
      icon: mdi:wifi-strength-2
      entity_category: diagnostic
