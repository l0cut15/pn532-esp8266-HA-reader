substitutions:
  name: nfc-reader
  friendly_name: NFC Reader

esphome:
  name: $name
  friendly_name: $friendly_name
  on_boot:
    priority: -10
    then:
      - wait_until:
          api.connected:
      - light.turn_on:
          id: status_light
          brightness: 30%
          red: 100%
          green: 100%
          blue: 100%

esp8266:
  board: d1_mini

# Local fork of the PN532 driver (see components/README.md)
external_components:
  - source:
      type: local
      path: components
    components: [pn532, pn532_i2c]

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true  # also enforces WPA2 minimum auth on ESP8266
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_fallback_password

captive_portal:

i2c:
  sda: D2
  scl: D1
  scan: false
  frequency: 100kHz

light:
  - platform: neopixelbus
    variant: WS2812
    pin: D8
    num_leds: 1
    type: GRB
    id: status_light
    name: "${friendly_name} LED"
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

globals:
  - id: tag_id
    type: std::string
  # --- reliability instrumentation ---
  - id: n_events      # on_tag fired
    type: uint32_t
    initial_value: '0'
  - id: n_ha          # tag_scanned sent
    type: uint32_t
    initial_value: '0'
  - id: n_nondef      # on_tag without HA NDEF
    type: uint32_t
    initial_value: '0'
  - id: n_removed     # on_tag_removed fired
    type: uint32_t
    initial_value: '0'
  - id: t_removed     # millis() at last removal
    type: uint32_t
    initial_value: '0'
  - id: t_tag         # millis() at last on_tag
    type: uint32_t
    initial_value: '0'

pn532_i2c:
  id: pn532_board
  # Reliability tuning (options added by the local fork in components/pn532)
  update_interval: 250ms     # poll 4x/s so short taps and quick re-taps are seen
  rx_gain: 48dB              # max receiver gain (chip default 38dB)
  activation_retries: 3      # "no card" answers in ms instead of waiting for an abort
  removal_misses: 3          # ~750ms of empty polls before a tag counts as removed
  read_attempts: 4           # re-read a held tag on up to 4 polls before reporting it unreadable
  page_retries: 2            # re-select + retry a failed page read within one poll
  on_tag:
    then:
      - lambda: |-
          id(tag_id) = "";
          int nrec = -1;
          if (tag.has_ndef_message()) {
            auto message = tag.get_ndef_message();
            auto &records = message->get_records();
            nrec = records.size();
            for (auto &record : records) {
              std::string payload = record->get_payload();
              std::string type = record->get_type();
              if (type == "U") {
                size_t hass = payload.find("https://www.home-assistant.io/tag/");
                if (hass != std::string::npos) {
                  id(tag_id) = payload.substr(hass + 34);
                }
              }
            }
          }
          uint32_t now = millis();
          id(n_events)++;
          if (id(tag_id).empty()) id(n_nondef)++; else id(n_ha)++;
          ESP_LOGI("nfcstat", "NFCSTAT ev=tag uid=%s type=%s ndef_records=%d result=%s since_removed_ms=%u since_tag_ms=%u events=%u ha=%u nondef=%u removed=%u",
                   x.c_str(), tag.get_tag_type().c_str(), nrec,
                   id(tag_id).empty() ? "nondef" : "ha",
                   (unsigned) (now - id(t_removed)), (unsigned) (now - id(t_tag)),
                   id(n_events), id(n_ha), id(n_nondef), id(n_removed));
          id(t_tag) = now;
          id(s_events).publish_state(id(n_events));
          id(s_ha).publish_state(id(n_ha));
          id(s_nondef).publish_state(id(n_nondef));
          char buf[96];
          snprintf(buf, sizeof(buf), "%s | %s | %ums", x.c_str(),
                   id(tag_id).empty() ? "NO-NDEF" : id(tag_id).c_str(),
                   (unsigned) (now - id(t_removed)));
          id(s_last).publish_state(buf);
      - if:
          condition:
            lambda: 'return !id(tag_id).empty();'
          then:
            - homeassistant.tag_scanned: !lambda 'return id(tag_id);'
            - logger.log:
                format: "Tag scanned: %s"
                args: [id(tag_id).c_str()]
            - light.turn_on:
                id: status_light
                flash_length: 1s
                brightness: 100%
                red: 0%
                green: 100%
                blue: 0%
          else:
            - logger.log:
                format: "Tag ignored (no HA NDEF): %s"
                args: [x.c_str()]
            - light.turn_on:
                id: status_light
                flash_length: 1s
                brightness: 100%
                red: 100%
                green: 0%
                blue: 0%
  on_tag_removed:
    then:
      - lambda: |-
          uint32_t now = millis();
          id(n_removed)++;
          ESP_LOGI("nfcstat", "NFCSTAT ev=removed uid=%s held_ms=%u events=%u ha=%u nondef=%u removed=%u",
                   x.c_str(), (unsigned) (now - id(t_tag)),
                   id(n_events), id(n_ha), id(n_nondef), id(n_removed));
          id(t_removed) = now;
          id(s_removed).publish_state(id(n_removed));
      - homeassistant.event:
          event: esphome.tag_removed

# --- Tag writing buttons (visible in HA device page) ---

button:
  - platform: template
    name: Write Tag Random
    icon: "mdi:pencil-box"
    on_press:
      then:
        - lambda: |-
            static const char hex[] = "0123456789abcdef";
            std::string uri = "https://www.home-assistant.io/tag/";
            for (int i = 0; i < 8; i++)  uri += hex[random_uint32() % 16];
            uri += "-";
            for (int j = 0; j < 3; j++) {
              for (int i = 0; i < 4; i++) uri += hex[random_uint32() % 16];
              uri += "-";
            }
            for (int i = 0; i < 12; i++) uri += hex[random_uint32() % 16];
            auto message = new nfc::NdefMessage();
            message->add_uri_record(uri);
            ESP_LOGD("nfc-reader", "Writing: %s", uri.c_str());
            id(pn532_board).write_mode(message);
        - wait_until:
            not:
              pn532.is_writing:
        - logger.log: "Tag written"
  - platform: template
    name: Clean Tag
    icon: "mdi:nfc-variant-off"
    on_press:
      then:
        - lambda: "id(pn532_board).clean_mode();"
        - wait_until:
            not:
              pn532.is_writing:
  - platform: template
    name: Cancel Writing
    icon: "mdi:pencil-off"
    on_press:
      then:
        - lambda: "id(pn532_board).read_mode();"
  - platform: restart
    name: "${friendly_name} Restart"
    entity_category: config

# --- Diagnostic entities ---

sensor:
  - platform: template
    id: s_events
    name: "${friendly_name} Tag Events"
    icon: mdi:counter
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic
  - platform: template
    id: s_ha
    name: "${friendly_name} HA Tag Scans"
    icon: mdi:counter
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic
  - platform: template
    id: s_nondef
    name: "${friendly_name} Unreadable Reads"
    icon: mdi:alert-circle-outline
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic
  - platform: template
    id: s_removed
    name: "${friendly_name} Tag Removals"
    icon: mdi:counter
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "${friendly_name} Status"
    entity_category: diagnostic

text_sensor:
  - platform: template
    id: s_last
    name: "${friendly_name} Last Tag Event"
    icon: mdi:nfc
    update_interval: never
    entity_category: diagnostic
  - platform: version
    hide_timestamp: true
    name: "${friendly_name} ESPHome Version"
    entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
      icon: mdi:wifi
      entity_category: diagnostic
    ssid:
      name: "${friendly_name} Connected SSID"
      icon: mdi:wifi-strength-2
      entity_category: diagnostic
